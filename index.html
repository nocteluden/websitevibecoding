<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sophia Surprise Machine</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="floating boba">🧋</div>
  <div class="floating star">✦</div>
  <div class="floating moon">☾</div>
  <div class="floating book">📖</div>

  <main class="page">
    <section class="card">
      <p class="eyebrow">tiny internet gift</p>
      <h1>Playful Sophia Message</h1>
      <p class="subtitle">
        Press the button and receive a small personalized message from the universe.
      </p>

      <button id="generateButton">
        Generate a surprise
      </button>

      <div id="outputBox" class="output-box">
        Waiting politely.
      </div>

      <p class="hint">
        Results may contain traces of ambition, caffeine, and dramatic destiny.
      </p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
